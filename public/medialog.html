  <h1 style="user-select: none;">MY UNSERIOUS<br>MEDIA LOG</h1>
  <h3 style="border: 2px solid black;user-select: none;">a collection of my stream-of-consciousness reactions to the things i read, watch, and play. don't expect much! spoilers everywhere.</h3>
  
  <div id="content"></div>
  
  <script src="//code.jquery.com/jquery-3.6.0.min.js" type="text/javascript"></script>
  
  <script type="text/javascript">
    var GRIST_DOC_ID = "k9K537SAjQ9Bxyg3mW8xF8"
    var GRIST_TABLE_ID = "log";

    $(document).ready(function () {
        var gristUrl = "https://getgrist.com" + GRIST_DOC_ID + "/download/data?table=" + GRIST_TABLE_ID;

        $.getJSON(gristUrl, function (records) {
            console.log("Data loaded successfully:", records); 
            
            records.forEach(function (entry) { 
              let div = $(`<div class="item">
                <div class="left">
                  <p class="details">` + (entry.type || '') + ` <br> ` + (entry.date || '') + ` <br> <strong>status:</strong><br> ` + (entry.status || '') + `</p>
                  <img alt="` + (entry.alt || '') + `" class="cover" src="` + (entry.image || '') + `">
                </div>
                <a class="titleLink" target="_blank" href="` + (entry.link || '') + `">` + (entry.title || '') + `</a>
                <br>
                <p class="text">` + (entry.review || '') + `</p>
              </div></div>`)
              .appendTo("#content"); 
            });
        }).fail(function(xhr, status, error) {
            console.error("Grist lookup failed. Check your Doc ID, Table ID, and Link Sharing settings:", error);
        });  
    });
  </script>
